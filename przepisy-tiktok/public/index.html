<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Przepisy z TikToka</title>
<meta name="theme-color" content="#e8553d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  :root {
    --bg: #faf7f2; --card: #fff; --text: #2a2420; --muted: #7a6e66; --line: #ece5dc;
    --accent: #e8553d; --accent-ink: #fff; --chip: #f4ece3; --done: #b8aea6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1714; --card: #24201c; --text: #f1ebe4; --muted: #a59a90; --line: #37302a;
      --accent: #ff7a5c; --accent-ink: #1a1714; --chip: #322b25; --done: #6a6058; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 64px; }
  header { display: flex; align-items: center; gap: 10px; margin: 8px 0 20px; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  header img { width: 32px; height: 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  input, textarea { width: 100%; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer;
    background: var(--chip); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: .6; cursor: progress; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; margin: 10px 0 6px; }
  .msg { margin-top: 10px; font-size: 14px; }
  .msg.err { color: var(--accent); }
  .search { margin: 24px 0 12px; }
  .list { display: grid; gap: 10px; }
  .item { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
  .item img, .item .ph { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: none;
    background: var(--chip); display: grid; place-items: center; font-size: 26px; }
  .item h3 { margin: 0 0 2px; font-size: 17px; }
  .meta { color: var(--muted); font-size: 14px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { background: var(--chip); border-radius: 99px; padding: 2px 10px; font-size: 13px; }
  .hero { width: 100%; height: 200px; border-radius: 12px; object-fit: cover; margin-bottom: 14px;
    display: grid; place-items: center; font-size: 72px; }
  .title-row { display: flex; gap: 8px; align-items: flex-start; }
  .title-row h2 { flex: 1; }
  .icon-btn { padding: 6px 10px; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .back { margin-bottom: 14px; }
  .detail h2 { margin: 0 0 6px; font-size: 26px; line-height: 1.2; }
  .detail h4 { margin: 22px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .facts { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; font-size: 15px; }
  .ing { list-style: none; padding: 0; margin: 0; }
  .ing li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .ing li.done { color: var(--done); text-decoration: line-through; }
  .ing .amt { margin-left: auto; color: var(--muted); white-space: nowrap; }
  .ing .grp { font-weight: 600; margin-top: 10px; border: 0; cursor: default; }
  ol.steps { padding-left: 22px; margin: 0; }
  ol.steps li { padding: 6px 0; cursor: pointer; }
  ol.steps li.done { color: var(--done); }
  .tips li { margin: 4px 0; }
  .raw { white-space: pre-wrap; font-size: 14px; color: var(--muted); }
  .actions { margin-top: 24px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor;
    border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  /* nawigacja */
  header { flex-wrap: wrap; }
  nav { margin-left: auto; display: flex; gap: 4px; }
  nav a { color: var(--text); text-decoration: none; padding: 6px 10px; border-radius: 99px; font-size: 15px; }
  nav a.active { background: var(--chip); font-weight: 600; }
  /* porcje */
  .portions-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 22px; }
  .portions-row h4 { margin: 0; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 99px; padding: 2px; }
  .stepper button { width: 34px; height: 34px; padding: 0; border-radius: 50%; background: var(--card); font-size: 18px; line-height: 1; }
  .stepper b { min-width: 84px; text-align: center; font-size: 15px; }
  .hint { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
  .timer-chip { padding: 2px 10px; font-size: 13px; border-radius: 99px; margin-left: 4px; background: var(--chip); }
  /* minutniki */
  #timers { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 30;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; width: min(560px, calc(100% - 32px)); }
  body:has(#timers:not([hidden])) .wrap { padding-bottom: 160px; }
  .timer { display: flex; gap: 10px; align-items: center; background: var(--text); color: var(--bg);
    border-radius: 12px; padding: 8px 8px 8px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  .timer .t-time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
  .timer .t-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; opacity: .85; }
  .timer button { background: transparent; color: inherit; padding: 4px 10px; }
  .timer.ringing { background: var(--accent); color: var(--accent-ink); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.02); } }
  /* tryb gotowania */
  body.no-scroll { overflow: hidden; }
  #cooking { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  #cooking[hidden] { display: none; }
  .c-top { display: flex; align-items: center; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
  .c-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-progress { height: 4px; background: var(--line); border-radius: 2px; margin: 12px auto 0; max-width: 760px; width: 100%; }
  .c-progress div { height: 100%; background: var(--accent); border-radius: 2px; transition: width .2s; }
  .c-body { flex: 1; overflow-y: auto; max-width: 760px; width: 100%; margin: 0 auto; padding: 24px 0 140px; }
  .c-kicker { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
  .c-step { font-size: clamp(24px, 6vw, 34px); line-height: 1.35; margin: 0 0 24px; }
  .c-portions { margin-bottom: 12px; }
  .c-ing li { font-size: 19px; padding: 10px 0; }
  .c-nav { display: flex; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
  .c-nav button { flex: 1; padding: 16px; font-size: 18px; }
  body:has(#cooking:not([hidden])) #timers { bottom: 96px; }
  /* lista zakupów */
  .shop-title { margin: 0 0 12px; font-size: 22px; }
  .cart { list-style: none; padding: 0; margin: 0 0 12px; }
  .cart li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .cart a { color: inherit; text-decoration: none; font-weight: 600; }
  .shop h4:first-child { margin-top: 0; }
  button.link { background: none; padding: 0 4px; color: var(--muted); font-size: 13px; text-decoration: underline; }
  .shop li { align-items: center; }
  .shop li .grow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  .shop .sub { width: 100%; color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; color: var(--muted); background: var(--chip); border-radius: 99px; padding: 0 8px; }
  .icon-btn.edit { margin-left: 4px; padding: 4px 8px; background: transparent; }
  .add-item { display: grid; gap: 8px; margin-bottom: 8px; }
  .amount-input { width: 110px; }
  select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .removed summary { margin: 0; }
  .removed li { align-items: center; }
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text);
    padding: 20px; width: min(420px, calc(100% - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h3 { margin: 0 0 12px; }
  dialog label { display: grid; gap: 4px; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
  dialog label[hidden] { display: none; }
  dialog [hidden] { display: none; }
  .lang-toggle { margin: 2px 0 10px; padding: 6px 12px; font-size: 14px; border-radius: 99px; }
  .lang-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--chip);
    border-radius: 10px; padding: 8px 12px; margin: 0 0 10px; font-size: 14px; }
  .lang-bar.err { color: var(--accent); }
  .lang-bar button { padding: 6px 12px; font-size: 14px; background: var(--card); }
  .lang-select { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
  .lang-select select { padding: 6px 10px; }
  /* kopia zapasowa */
  .backup { margin-top: 32px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
  .backup .msg { width: 100%; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/icon.svg" alt=""><h1>Przepisy z TikToka</h1>
    <nav><a href="#/" id="nav-recipes">Przepisy</a><a href="#/zakupy" id="nav-shop">🛒 Zakupy</a></nav>
  </header>
  <main id="app"></main>
</div>
<div id="timers" hidden></div>
<div id="cooking" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
