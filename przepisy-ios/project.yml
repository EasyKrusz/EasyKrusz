# Projekt Xcode generowany przez XcodeGen:  brew install xcodegen && xcodegen
name: Przepisy
options:
  bundleIdPrefix: pl.easykrusz
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl

settings:
  base:
    # >>> Zmień na swoje: ID zespołu z developer.apple.com (Xcode: Settings → Accounts)
    DEVELOPMENT_TEAM: ""
    # >>> Jeśli Xcode zgłosi, że identyfikator jest zajęty, zmień ten prefiks (np. pl.twojeimie)
    BUNDLE_ID_PREFIX: pl.easykrusz.przepisy
    APP_GROUP_ID: group.$(BUNDLE_ID_PREFIX)
    KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).shared
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Przepisy:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Przepisy
        CFBundleDevelopmentRegion: pl
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSRemindersFullAccessUsageDescription: Aplikacja dodaje listę zakupów do Przypomnień, gdy o to poprosisz.
        NSSpeechRecognitionUsageDescription: Gdy filmik nie ma przepisu w opisie ani napisów, aplikacja rozpoznaje mowę z nagrania, żeby ułożyć z niej przepis.
        AppGroupID: $(APP_GROUP_ID)
        KeychainGroup: $(KEYCHAIN_GROUP)
    entitlements:
      path: App/Przepisy.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(KEYCHAIN_GROUP)]
    dependencies:
      - target: PrzepisyShare

  PrzepisyShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Przepisy
        CFBundleDevelopmentRegion: pl
        AppGroupID: $(APP_GROUP_ID)
        KeychainGroup: $(KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/PrzepisyShare.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(KEYCHAIN_GROUP)]
